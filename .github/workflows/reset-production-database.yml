name: Reset Production Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "I understand" to confirm database reset'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        if: github.event.inputs.confirm != 'I understand'
        run: |
          echo "❌ Database reset cancelled. Confirmation required."
          echo "To reset production database, re-run with input: 'I understand'"
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reset database
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services ${{ vars.ECS_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)

          TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services ${{ vars.ECS_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].taskDefinition' --output text)

          # Reset database (drop + migrate + seed)
          RESET_CMD='uv run python -m scripts.reset_database'

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "{\"awsvpcConfiguration\": $NETWORK_CONFIG}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"backend\",\"command\":[\"sh\",\"-c\",\"$RESET_CMD\"],\"environment\":[{\"name\":\"CONFIRM_RESET\",\"value\":\"yes\"}]}]}" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].taskArn' --output text)

          echo "Task ARN: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --tasks "$TASK_ARN" \
            --region ${{ env.AWS_REGION }}

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --tasks "$TASK_ARN" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Reset task failed with exit code $EXIT_CODE"
            exit 1
          fi

          echo "✅ Database reset complete"
